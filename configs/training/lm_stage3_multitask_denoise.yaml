# Language model L, stage 3 of 3 (gemma_multitask_denoise_novis, the released L): from stage 2 step 3000, noisy
# (whole-window) select-then-edit rows added to the silenced ones. The run ends at step 1000: ckpt_s01000.pt is L.
# ${RML_*} placeholders are filled in by scripts/train/train_lm.py (see docs/TRAINING.md).
run_name: gemma_multitask_denoise_novis
init_from: "${RML_OUT_DIR}/gemma_select_then_edit_novis/ckpt_s03000.pt"   # --init-from (ignored when resuming from <out>/last.pt)
args:
  data: "${RML_LM_STAGE3_DATA}"
  keep-meta: "${RML_LM_STAGE3_DATA}/keep_meta.json"
  select-edit: true
  aux-max-new: 128
  lr-adapter: 1.0e-4
  lr-lora: 5.0e-5
  max-steps: 2500
  warmup-steps: 0
  stop-at-step: 1000
  eval-every: 500
  keep-ckpts: "1000"
  reader-pool:                  # stage 3: each reader's train n-best + its denoise-row lists (build_gemma_denoise_rows.py)
    - "clean=${RML_LM_READERS}/autoavsr_vsr_clean_train_shard*.json,${RML_LM_STAGE3_DATA}/readers_denoise/clean.json:0.5"
    - "down4=${RML_LM_READERS}/autoavsr_vsr_down4_train_shard*.json,${RML_LM_STAGE3_DATA}/readers_denoise/down4.json:0.15"
    - "drop50=${RML_LM_READERS}/autoavsr_vsr_drop50_train_shard*.json,${RML_LM_STAGE3_DATA}/readers_denoise/drop50.json:0.15"
    - "avhubert=${RML_LM_READERS}/avhubert_vsr_train.json,${RML_LM_STAGE3_DATA}/readers_denoise/avhubert.json:0.2"
# Shared by the three stages. Keys are train_vis2gemma.py flags; true = bare flag.
  gap-dur-prompt: true
  batch-size: 4
  grad-accum: 4                 # effective batch 16
  lora-r: 32                    # LoRA alpha = 2 r = 64 (fixed in the code)
  lora-dropout: 0.1
  lr-schedule: cosine           # cosine to 10% of the base LR over max-steps
  patience: 100
  save-every: 100
  val-nbest: 5
  ctx-word-drop: 0.15
  cfd-schedule: "0:0.5,4000:0.3,7000:0.15"   # context full-drop curriculum (step:p)
  time-mask-p: 0.5
  time-mask-len: 4
  feat-noise: 0.05
  one-cut-per-window: true
  chat-wrap: true
  deterministic: true
  seed: 0
  eval-attn: sdpa
  decode-batch: 8
  reader-nbest-k: 10            # hypotheses shown per training row: uniform 1..10
