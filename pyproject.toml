[project]
name = "read-my-lips"
version = "1.0.0"
description = "Read My Lips: context-aware lip reading with language and audio-visual models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "ltx-core",
    "ltx-trainer",
    "ltx-pipelines",
    # torch 2.9.1 (cu128 wheels on Linux); torchaudio / torchvision must match its minor version
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision==0.24.1",
    "torchcodec>=0.9,<0.10",
    "transformers>=5.14,<6",
    "peft>=0.19",
    "safetensors>=0.8",
    "optimum-quanto>=0.2.7",
    "accelerate>=1.14",
    "whisperx>=3.7.2",
    "mediapipe>=0.10.35",
    "opencv-python>=4.10",
    "soundfile>=0.13.1",
    "librosa>=0.10",
    "scipy>=1.14",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    # Auto-AVSR (third_party/auto_avsr)
    "pytorch-lightning>=2.6",
    "omegaconf>=2.3",
    "sentencepiece>=0.2",
]

[project.optional-dependencies]
# mouth-ROI preparation (dlib needs cmake and a C++ compiler to build)
roi = ["dlib>=19.24"]

[dependency-groups]
dev = ["pytest~=9.0", "ruff>=0.15"]

[tool.uv.sources]
ltx-core = { workspace = true }
ltx-trainer = { workspace = true }
ltx-pipelines = { workspace = true }

[tool.uv.workspace]
members = ["packages/ltx-core", "packages/ltx-pipelines", "packages/ltx-trainer"]

[tool.uv]
# the release is tested on Linux with CUDA 12.8 drivers
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rml"]

[tool.ruff]
target-version = "py312"
line-length = 140
extend-exclude = ["packages", "third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RUF"]
# SIM115 / C405 / RUF005 / E702: style of code kept as it ran for the paper
ignore = ["E741", "B905", "RUF001", "RUF002", "RUF003", "SIM108", "B023", "SIM115", "C405", "RUF005", "E702"]

[tool.ruff.lint.per-file-ignores]
"rml/eval/span_rules.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rml", "ltx_core", "ltx_pipelines", "ltx_trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
